name: Validar y generar APK Android

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      compare_previous:
        description: Comparar también con el APK 0.4.1-ci.29 si sigue disponible
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar proyecto y compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_BUILD_TOOLS_VERSION: "35.0.1"
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Preparar los directorios temporales
        shell: bash
        run: |
          printf '%s\n' \
            "XDG_CONFIG_HOME=$RUNNER_TEMP/godot-config" \
            "XDG_DATA_HOME=$RUNNER_TEMP/godot-data" \
            "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/android-signing/debug.keystore" \
            >> "$GITHUB_ENV"

      - name: Preparar Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar las herramientas Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "platforms;android-35"

      - name: Descargar y comprobar Godot
        shell: bash
        run: |
          set -euo pipefail
          godot_version="$(tr -d '\r\n' < .godot-version)"
          [[ "$godot_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="Godot_v${godot_version}-stable_linux.x86_64.zip"
          mkdir -p .godot-download
          curl --fail --location --silent --show-error --retry 3 \
            "https://downloads.godotengine.org/?version=${godot_version}&flavor=stable&slug=linux.x86_64.zip" \
            --output ".godot-download/${archive}"
          (cd .godot-download && sha512sum --check ../tools/godot-linux-x86_64.sha512)
          unzip -q ".godot-download/${archive}" -d .godot-download
          executable="${GITHUB_WORKSPACE}/.godot-download/Godot_v${godot_version}-stable_linux.x86_64"
          chmod +x "$executable"
          printf '%s\n' "GODOT_BIN=$executable" >> "$GITHUB_ENV"
          printf '%s\n' "GODOT_VERSION=$godot_version" >> "$GITHUB_ENV"

      - name: Instalar las plantillas Android de la misma versión
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=export_templates.tpz" \
            --output ".godot-download/${archive}"
          (cd .godot-download && sha256sum --check ../tools/godot-export-templates.sha256)
          unzip -q ".godot-download/${archive}" \
            templates/android_debug.apk templates/android_release.apk templates/version.txt \
            -d .godot-download
          templates_dir="$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates_dir"
          test "$(tr -d '\r\n' < .godot-download/templates/version.txt)" = "${GODOT_VERSION}.stable"
          cp .godot-download/templates/android_debug.apk \
            .godot-download/templates/android_release.apk "$templates_dir/"

      - name: Recuperar la firma de pruebas
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.GODOT_ANDROID_KEYSTORE_DEBUG_PATH }}
          key: salto-heroes-android-debug-keystore-v1

      - name: Preparar la firma de pruebas y la exportación
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" ]]; then
            mkdir -p "$(dirname "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH")"
            keytool -genkeypair -noprompt -storetype JKS \
              -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
              -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
              -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
              -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Salto Heroes Debug,O=Juego Diego,C=ES"
          fi
          python3 tools/ci/configure_android.py

      - name: Importar y comprobar el arranque
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-logs
          "$GODOT_BIN" --version
          "$GODOT_BIN" --headless --path . --editor --import --quit 2>&1 | tee .godot-logs/import.log
          "$GODOT_BIN" --headless --path . --quit-after 3 2>&1 | tee .godot-logs/startup.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR|Parse Error):' .godot-logs/*.log; then
            exit 1
          fi

      - name: Comprobar el protagonista y los controles
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --fixed-fps 60 --path . \
            --script tools/tests/test_player.gd 2>&1 | tee .godot-logs/player-tests.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR|Parse Error):' .godot-logs/player-tests.log; then
            exit 1
          fi

      - name: Comprobar los seis objetos arrojadizos
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --fixed-fps 60 --path . \
            --script tools/tests/test_throwables.gd 2>&1 | tee .godot-logs/object-tests.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR|Parse Error):' .godot-logs/object-tests.log; then
            exit 1
          fi

      - name: Comprobar el Bosque Esmeralda
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --fixed-fps 60 --path . \
            --script tools/tests/test_forest.gd 2>&1 | tee .godot-logs/forest-tests.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR|Parse Error):' .godot-logs/forest-tests.log; then
            exit 1
          fi

      - name: Comprobar dianas y puentes de raíces
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --fixed-fps 60 --path . \
            --script tools/tests/test_bridges.gd 2>&1 | tee .godot-logs/bridge-tests.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR|Parse Error):' .godot-logs/bridge-tests.log; then
            exit 1
          fi

      - name: Comprobar troncos viajeros y recuperación
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --fixed-fps 60 --path . \
            --script tools/tests/test_moving_platforms.gd 2>&1 | tee .godot-logs/moving-platform-tests.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR|Parse Error):' .godot-logs/moving-platform-tests.log; then
            exit 1
          fi
          python3 .agents/skills/crear-dinamicas-salto-heroes/scripts/validar_dinamicas.py \
            docs/dinamicas/puente_diana.json docs/dinamicas/troncos_viajeros.json

      - name: Capturar el nivel en móvil y tablet
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$GODOT_BIN" \
            --rendering-method gl_compatibility --audio-driver Dummy --path . \
            --script tools/tests/capture_forest.gd 2>&1 | tee .godot-logs/forest-render.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR|Parse Error):' .godot-logs/forest-render.log; then
            exit 1
          fi

      - name: Guardar las capturas del Bosque Esmeralda
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bosque-esmeralda-capturas-${{ github.run_number }}
          path: art/levels/bosque_esmeralda/preview_*.png
          if-no-files-found: error
          retention-days: 30

      - name: Exportar el APK instalable
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --export-debug Android \
            "$GITHUB_WORKSPACE/builds/android/salto-heroes.apk" \
            2>&1 | tee .godot-logs/export-android.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR|Parse Error):' .godot-logs/export-android.log; then
            exit 1
          fi
          test -s builds/android/salto-heroes.apk

      - name: Comprobar los datos del nivel dentro del APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('builds/android/salto-heroes.apk') as apk:
              names = [name for name in apk.namelist() if name.endswith('-level_01.res')]
              assert len(names) == 1, names
              Path('.godot-logs/apk-level_01.res').write_bytes(apk.read(names[0]))
          PY
          "$GODOT_BIN" --headless --path . --script tools/tests/test_exported_level.gd \
            2>&1 | tee .godot-logs/exported-level-tests.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR|Parse Error):' .godot-logs/exported-level-tests.log; then
            exit 1
          fi

      - name: Comprobar la firma y el paquete Android
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$build_tools/apksigner" verify --verbose --print-certs \
            builds/android/salto-heroes.apk | tee .godot-logs/apk-signature.log
          "$build_tools/aapt" dump badging builds/android/salto-heroes.apk \
            > .godot-logs/apk-package.log
          grep -q "package: name='com.ramonc5.saltoheroes'" .godot-logs/apk-package.log
          grep -q "native-code: 'arm64-v8a'" .godot-logs/apk-package.log
          (cd builds/android && sha256sum salto-heroes.apk > salto-heroes.apk.sha256)

      - name: Guardar el APK para descargar
        id: apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: salto-heroes-android-${{ github.run_number }}
          path: |
            builds/android/salto-heroes.apk
            builds/android/salto-heroes.apk.sha256
            builds/android/build-info.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Recuperar el APK anterior para comparar en Android
        if: github.event_name == 'workflow_dispatch' && inputs.compare_previous
        continue-on-error: true # La referencia es temporal; el APK actual siempre se prueba.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download 39010194148 --repo "$GITHUB_REPOSITORY" \
            --name salto-heroes-android-29 --dir "$RUNNER_TEMP/salto-baseline"

      - name: Habilitar aceleración para el emulador Android
        shell: bash
        run: |
          # Ya están verificados e instalados; liberar solo las descargas de esta compilación.
          rm -f .godot-download/*.zip .godot-download/*.tpz
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar y jugar el APK ARM64 en Android
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          disk-size: 2048M
          ram-size: 4096M
          emulator-boot-timeout: 240
          # Mesa evita el fallo GLSL de SwiftShader observado en godotengine/godot#109550.
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu lavapipe -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 tools/ci/test_android_apk.py --apk builds/android/salto-heroes.apk --baseline "$RUNNER_TEMP/salto-baseline/salto-heroes.apk"

      - name: Guardar pruebas del APK instalado en Android
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk-pruebas-${{ github.run_number }}
          path: art/android/
          if-no-files-found: ignore
          retention-days: 30

      - name: Mostrar la descarga y las instrucciones
        env:
          APK_ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        shell: bash
        run: |
          {
            printf '## APK Android generado\n\n'
            printf '[Descargar el APK de Salto Heroes](%s)\n\n' "$APK_ARTIFACT_URL"
            printf 'Descomprime el ZIP y abre salto-heroes.apk en un móvil Android ARM64.\n\n'
            printf 'Si Android lo solicita, permite instalar aplicaciones desde el navegador o gestor de archivos utilizado.\n\n'
            printf 'Versión de pruebas: Bosque Esmeralda 1-1, protagonista Diego y entrenamiento. El artefacto se conserva durante 30 días.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conservar los registros si falla la compilación
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: .godot-logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7


