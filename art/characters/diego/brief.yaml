character_id: diego
role: player
display_name: Diego
design_status: proposed
date: 2026-10-15
world_ids: []
confirmed_requirements:
  - Protagonista basado en el niño de la fotografía adjunta 1000074224.jpg.
  - Mantener pelo oscuro, gafas negras grandes, sonrisa y rasgos reconocibles.
  - Adaptar vestuario y acabado al juego de plataformas raster 2D.
  - Movimientos, animaciones y controles táctiles para Android y tablet Windows.
  - Registrar ficha, imagen, prompts, metadatos y revisión; subirlos a Git.
  - Conservar ocho mundos, niveles rejugables, pisotón y objetos lanzables.
proposed_decisions:
  name: Diego, nombre de trabajo por el proyecto Juego Diego.
  clothes: Camiseta marfil, chaleco corto de tela verde azulado, pañuelo mostaza, pantalón corto azul y botas marrones.
  personality: Curioso, alegre y decidido; celebración breve y derrota amable.
  camera: Vista lateral hacia la derecha, rostro ligeramente visible y luz superior izquierda.
  graphics: Raster HD texturizado con sombreado suave; escenas y física exclusivamente 2D.
  gameplay: Aceleración, caminar, correr, salto variable, margen de borde, salto anticipado, rebote, recoger, transportar y lanzar.
  accessibility: Carrera automática opcional, salto completo con pulsación, recorrido y lados de los gestos sin botones fijos, teclado reasignable y foco visible.
  health: Tres puntos de energía y protección temporal sin parpadeos, editables.
production:
  tool: image_gen integrada
  reference: concept_v001.png
  sprite_sheets: 10
  source_poses: 44
  runtime_states: 13
  atlas: Regiones explícitas de AtlasTexture; los PNG se conservan sin retoque mediante código.
  root: Apoyo de los pies en [512, 900] de un lienzo virtual de 1024 por 1024.
  scale: Uniforme por hoja; altura de pie aproximada de 112 píxeles lógicos.
  release_marker: throw, fotograma 2, índice desde cero.
open_decisions:
  - Aceptación visual del nuevo protagonista por el usuario.
  - Especificación detallada de la elección artística opción A.
  - Ajustes finales de movimiento y rendimiento en dispositivos físicos Android y Windows.
